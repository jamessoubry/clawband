name: Release

# Tagging vX.Y.Z builds binaries, publishes a GitHub release, and bumps the
# Homebrew tap (jamessoubry/homebrew-clawband).
#
# The tap bump requires a repo secret HOMEBREW_TAP_TOKEN: a fine-grained PAT
# with Contents: read & write on jamessoubry/homebrew-clawband. If the secret
# is absent the bump step is skipped (the release still succeeds).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.10.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: clawband-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: clawband-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: clawband-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: clawband-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.target, '-linux-musl')
        run: sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/clawband ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  smoke-test:
    name: Smoke test (linux-x86_64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: clawband-linux-x86_64

      - name: Make executable
        run: chmod +x clawband-linux-x86_64

      - name: Version flag prints
        run: ./clawband-linux-x86_64 --version | grep -E '^clawband v[0-9]'

      - name: Patterns subcommand runs
        run: ./clawband-linux-x86_64 patterns > /dev/null

      - name: Destructive command is denied
        run: |
          RESULT=$(printf '{"tool_name":"Bash","tool_input":{"command":"docker system prune -af"}}' \
            | ./clawband-linux-x86_64)
          echo "$RESULT" | grep -q '"permissionDecision":"deny"'

      - name: Safe command passes (no output)
        run: |
          RESULT=$(printf '{"tool_name":"Bash","tool_input":{"command":"ls -la"}}' \
            | ./clawband-linux-x86_64)
          if echo "$RESULT" | grep -q '"permissionDecision"'; then
            echo "FAIL: safe command should produce no decision output"
            exit 1
          fi
          echo "PASS: safe command produced no permissionDecision output"

      - name: git reset hard is asked
        run: |
          RESULT=$(printf '{"tool_name":"Bash","tool_input":{"command":"git reset --hard HEAD~1"}}' \
            | ./clawband-linux-x86_64)
          echo "$RESULT" | grep -q '"permissionDecision":"ask"'

  smoke-test-arm:
    name: Smoke test (linux-arm64)
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: clawband-linux-arm64

      - name: Make executable
        run: chmod +x clawband-linux-arm64

      - name: Version flag prints
        run: ./clawband-linux-arm64 --version | grep -E '^clawband v[0-9]'

      - name: Patterns subcommand runs
        run: ./clawband-linux-arm64 patterns > /dev/null

      - name: Destructive command is denied
        run: |
          RESULT=$(printf '{"tool_name":"Bash","tool_input":{"command":"docker system prune -af"}}' \
            | ./clawband-linux-arm64)
          echo "$RESULT" | grep -q '"permissionDecision":"deny"'

      - name: Safe command passes (no output)
        run: |
          RESULT=$(printf '{"tool_name":"Bash","tool_input":{"command":"ls -la"}}' \
            | ./clawband-linux-arm64)
          if echo "$RESULT" | grep -q '"permissionDecision"'; then
            echo "FAIL: safe command should produce no decision output"
            exit 1
          fi
          echo "PASS: safe command produced no permissionDecision output"

      - name: git reset hard is asked
        run: |
          RESULT=$(printf '{"tool_name":"Bash","tool_input":{"command":"git reset --hard HEAD~1"}}' \
            | ./clawband-linux-arm64)
          echo "$RESULT" | grep -q '"permissionDecision":"ask"'

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            clawband-linux-x86_64
            clawband-linux-arm64
            clawband-macos-x86_64
            clawband-macos-arm64

  bump-formula:
    name: Bump Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for tap token
        id: gate
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Tap token not set — skipping formula bump."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout clawband (for gen-formula.sh)
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Download release binaries
        if: steps.gate.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate and push formula
        if: steps.gate.outputs.present == 'true'
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"

          sha() { sha256sum "$1" | cut -d' ' -f1; }
          SHA_MAC_ARM="$(sha clawband-macos-arm64)"
          SHA_MAC_X86="$(sha clawband-macos-x86_64)"
          SHA_LINUX_X86="$(sha clawband-linux-x86_64)"
          SHA_LINUX_ARM="$(sha clawband-linux-arm64)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jamessoubry/homebrew-clawband.git" tap
          bash scripts/gen-formula.sh "$VERSION" "$SHA_MAC_ARM" "$SHA_MAC_X86" "$SHA_LINUX_X86" "$SHA_LINUX_ARM" \
            > tap/Formula/clawband.rb

          cd tap
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/clawband.rb
          git commit -m "clawband ${VERSION}"
          git push origin master
