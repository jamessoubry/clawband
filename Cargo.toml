[package]
name = "clawband"
version = "2.10.1"
edition = "2021"
description = "Claude Code PreToolUse hook that guards against destructive shell commands"
repository = "https://github.com/jamessoubry/clawband"
license = "MIT"

[[bin]]
name = "clawband"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
