[package]
name = "clawband"
version = "3.17.0"

edition = "2021"
description = "Claude Code PreToolUse hook that guards against destructive shell commands and unsafe file-write content"
repository = "https://github.com/jamessoubry/clawband"
license = "MIT"

[[bin]]
name = "clawband"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex = "1"
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
streaming-iterator = "0.1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
